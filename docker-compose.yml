# Stack Swarm + Traefik (VPS Skadi).
# A rede pública desta VM é `network_public` (overlay). Não use `docker compose up`.
# Produção: GitHub Actions faz build, publica no GHCR e o script deploy/vps-update.sh
# faz pull + stack deploy. Copie `.env.example` para `.env` na VPS.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_ASSISTANT_API_URL: ${NEXT_PUBLIC_ASSISTANT_API_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: ${CASOS_IMAGE:-ghcr.io/luiz-eduardo-alverga/casos-front:latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - public
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:-network_public}
        - traefik.http.routers.casos-front.rule=Host(`${TRAEFIK_HOST:-softflow.hostsoftcom.cloud}`)
        - traefik.http.routers.casos-front.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
        - traefik.http.routers.casos-front.service=casos-front
        - traefik.http.services.casos-front.loadbalancer.server.port=3000

networks:
  public:
    external: true
    name: ${TRAEFIK_NETWORK:-network_public}
